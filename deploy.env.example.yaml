# Settings for the live demo on Cloud Run. Copy to deploy.env.yaml (never committed, never uploaded with the code)
# and fill in. Format: NAME: "value" (a colon and a space, quotes around the value).

GROQ_API_KEY: "gsk_..."
# GROQ_MODEL: "openai/gpt-oss-120b"
# GROQ_FALLBACK_MODEL: "openai/gpt-oss-20b"

# Supabase's Session pooler address (the same one as Clinic Concierge; DocSift uses its own "docsift" schema).
DATABASE_URL: "postgresql://postgres.XXXX:PASSWORD@aws-1-us-west-2.pooler.supabase.com:5432/postgres"

# n8n: approved documents -> Google Sheet, reviews and failures -> email (automation/README.md)
EVENT_WEBHOOK_URL: "https://n8n-XXXX.us-west1.run.app/webhook/docsift"
EVENT_WEBHOOK_SECRET: "XXXX"

# Public-demo limits
UPLOADS_PER_HOUR_PER_VISITOR: "20"
UPLOADS_PER_DAY: "200"
MAX_UPLOAD_MB: "5"
MAX_PAGES: "3"
